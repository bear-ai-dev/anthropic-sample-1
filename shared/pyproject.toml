[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["mocklinear/tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["mocklinear"]
concurrency = ["thread"]

[tool.coverage.report]
fail_under = 100
omit = ["*/tests/*"]
